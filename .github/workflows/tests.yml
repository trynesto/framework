name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  phpunit:
    name: PHP ${{ matrix.php }}
    runs-on: ubuntu-latest
    timeout-minutes: 20

    strategy:
      fail-fast: false
      matrix:
        php: ['8.3', '8.4', '8.5']

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: nesto
          POSTGRES_DB: nesto_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d nesto_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20

      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: nesto
          MYSQL_DATABASE: nesto_test
        ports:
          - 3306:3306
        options: >-
          --health-cmd "mysqladmin ping -h 127.0.0.1 -uroot -pnesto"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

      mariadb:
        image: mariadb:11.4
        env:
          MARIADB_ROOT_PASSWORD: nesto
          MARIADB_DATABASE: nesto_test
        ports:
          - 3307:3306
        options: >-
          --health-cmd "healthcheck.sh --connect --innodb_initialized"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 30

    env:
      NESTO_TEST_PGSQL_URL: postgres://postgres:nesto@127.0.0.1:5432/nesto_test
      NESTO_TEST_MYSQL_URL: mysql://root:nesto@127.0.0.1:3306/nesto_test
      NESTO_TEST_MARIADB_URL: mariadb://root:nesto@127.0.0.1:3307/nesto_test

    steps:
      - uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: ${{ matrix.php }}
          extensions: pdo, pdo_pgsql, pdo_mysql, pdo_sqlite, fileinfo
          coverage: none
          tools: composer:v2

      - name: Install dependencies
        run: composer install --prefer-dist --no-interaction --no-progress

      - name: Run the tests
        run: vendor/bin/phpunit
